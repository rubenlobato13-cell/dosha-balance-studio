function DoshaApp() {
  const [tab,    setTab]    = useState("resumen");
  const [masajes,setMasajes]= useState(M0);
  const [citas,  setCitas]  = useState([]);
  const [loading, setLoading] = useState(true);
  const [saveStatus, setSaveStatus] = useState(""); // "guardando"|"guardado"|""

  // bonos[mid] = { s3: precio, s5: precio, s10: precio }
  const [bonoPrices, setBonoPrices] = useState(
    M0.reduce((acc,m)=>({...acc,[m.id]:{s3:"",s5:"",s10:""}}),{})
  );
  const [bonosVendidos, setBonosVendidos] = useState([]);
  const [bonoModal, setBonoModal] = useState(false);
  const [bonoForm, setBonoForm] = useState({ cid:"", mid:"", sesiones:"3" });

  // ── Carga inicial desde Firestore ──
  const { useEffect } = React;
  useEffect(() => {
    const db = window._db;
    if (!db) { setCitas(C0); setLoading(false); return; }
    const col = "dosha";
    Promise.all([
      db.collection(col).doc("citas").get(),
      db.collection(col).doc("clientes").get(),
      db.collection(col).doc("masajes").get(),
      db.collection(col).doc("bonos").get(),
      db.collection(col).doc("bonoPrices").get(),
    ]).then(([cd, cld, md, bd, bpd]) => {
      if (cd.exists)  setCitas(window._ser.citas_in(cd.data().data));
      else            setCitas(C0);
      if (cld.exists) setClientes(cld.data().data);
      if (md.exists)  setMasajes(md.data().data);
      if (bd.exists)  setBonosVendidos(window._ser.bonos_in(bd.data().data));
      if (bpd.exists) setBonoPrices(bpd.data().data);
      setLoading(false);
    }).catch(()=>{ setCitas(C0); setLoading(false); });
  }, []);

  // ── Helper guardado con feedback visual ──
  const save = (key, data) => {
    setSaveStatus("guardando");
    window._save[key](data)
      .then(()=>{ setSaveStatus("guardado"); setTimeout(()=>setSaveStatus(""),2000); })
      .catch(()=>setSaveStatus(""));
  };

  const [calBase,setCalBase]= useState(new Date(HOY.getFullYear(), HOY.getMonth(), 1));
  const [selDay, setSelDay] = useState(HOY);

  const [filtro, setFiltro] = useState("todas");
  const [busq,   setBusq]   = useState("");

  const [clientes, setClientes] = useState(CL0);

  const [selCl,   setSelCl]  = useState(null);
  const [mModal,  setMModal] = useState(false);
  const [ncModal, setNcModal]= useState(false);
  const [clModal, setClModal]= useState(false);
  const [copied,  setCopied] = useState(false);
  const [mForm,   setMForm]  = useState({ icon:"✨", nombre:"", min:"", precio:"", desc:"" });
  const [ncForm,  setNcForm] = useState({ cid:"", mid:"", fecha:"", hora:"", domicilio:false, extra:"" });
  const [clForm,  setClForm] = useState({ nombre:"", tel:"", email:"", fav:"", notas:"" });

  const LINK = "https://doshabalancestudio.com/reservas";

  const gM = (id) => masajes.find(m => m.id === id);
  const gC = (id) => clientes.find(c => c.id === id);

  const cobrar = (id) => {
    const n = citas.map(c => c.id===id ? {...c,estado:"cobrada"} : c);
    setCitas(n); save("citas", n);
  };
  const cancelar = (id) => {
    const n = citas.map(c => c.id===id ? {...c,estado:"cancelada"} : c);
    setCitas(n); save("citas", n);
  };

  const citasHoy = useMemo(() =>
    citas.filter(c => isSameDay(c.fecha, HOY)).sort((a,b) => a.fecha-b.fecha),
    [citas]
  );

  const cobHoy = citasHoy.filter(c=>c.estado==="cobrada").reduce((s,c)=>s+c.monto,0);
  const penHoy = citasHoy.filter(c=>c.estado==="pendiente").reduce((s,c)=>s+c.monto,0);
  const cobTot = citas.filter(c=>c.estado==="cobrada").reduce((s,c)=>s+c.monto,0);
  const penTot = citas.filter(c=>c.estado==="pendiente").reduce((s,c)=>s+c.monto,0);

  const daysSet = useMemo(() => {
    const s = new Set();
    citas.forEach(c => { const d=c.fecha; s.add(`${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`); });
    return s;
  }, [citas]);

  const filtered = useMemo(() => {
    let l = [...citas].sort((a,b)=>b.fecha-a.fecha);
    if (filtro !== "todas") l = l.filter(c=>c.estado===filtro);
    if (busq) {
      const q = busq.toLowerCase();
      l = l.filter(c => gC(c.cid)?.nombre.toLowerCase().includes(q) || gM(c.mid)?.nombre.toLowerCase().includes(q));
    }
    return l;
  }, [citas, filtro, busq, masajes, clientes]);

  const selDayCitas = useMemo(() =>
    citas.filter(c=>isSameDay(c.fecha,selDay)).sort((a,b)=>a.fecha-b.fecha),
    [citas, selDay]
  );

  const cy = calBase.getFullYear(), cm = calBase.getMonth();
  const daysInM = new Date(cy,cm+1,0).getDate();
  const startD  = (new Date(cy,cm,1).getDay()+6)%7;

  const clCitas = (id) => citas.filter(c=>c.cid===id);
  const clTotal = (id) => citas.filter(c=>c.cid===id && c.estado==="cobrada").reduce((s,c)=>s+c.monto,0);

  const addCliente = () => {
    if (!clForm.nombre) return;
    const nid = clientes.length ? Math.max(...clientes.map(c=>c.id))+1 : 1;
    const nuevo = {id:nid,nombre:clForm.nombre,tel:clForm.tel,email:clForm.email,fav:parseInt(clForm.fav)||1,notas:clForm.notas};
    const n = [...clientes, nuevo];
    setClientes(n); save("clientes", n);
    setClForm({nombre:"",tel:"",email:"",fav:"",notas:""});
    setClModal(false);
  };

  const updateBonoPrice = (mid, key, val) => {
    const n = {...bonoPrices,[mid]:{...bonoPrices[mid],[key]:val}};
    setBonoPrices(n); save("bonoPrices", n);
  };

  const getBonoPrice = (mid, ses) => {
    const key = ses===3?"s3":ses===5?"s5":"s10";
    return parseFloat(bonoPrices[mid]?.[key])||0;
  };

  const venderBono = () => {
    if (!bonoForm.cid || !bonoForm.mid) return;
    const ses = parseInt(bonoForm.sesiones);
    const precio = getBonoPrice(parseInt(bonoForm.mid), ses);
    const nid = bonosVendidos.length ? Math.max(...bonosVendidos.map(b=>b.id))+1 : 1;
    const n = [...bonosVendidos, {id:nid,cid:parseInt(bonoForm.cid),mid:parseInt(bonoForm.mid),sesiones:ses,usadas:0,precio,cobrado:false,fecha:new Date()}];
    setBonosVendidos(n); save("bonos", n);
    setBonoForm({cid:"",mid:"",sesiones:"3"});
    setBonoModal(false);
  };

  const usarSesionBono = (bid) => {
    const n = bonosVendidos.map(b=>b.id===bid&&b.usadas<b.sesiones?{...b,usadas:b.usadas+1}:b);
    setBonosVendidos(n); save("bonos", n);
  };

  const cobrarBono = (bid) => {
    const n = bonosVendidos.map(b=>b.id===bid?{...b,cobrado:true}:b);
    setBonosVendidos(n); save("bonos", n);
  };

  const addMasaje = () => {
    if (!mForm.nombre || !mForm.precio) return;
    const nid = Math.max(...masajes.map(m=>m.id))+1;
    const n = [...masajes, {id:nid,nombre:mForm.nombre,min:parseInt(mForm.min)||60,precio:parseFloat(mForm.precio)||0,extra30:0,desc:mForm.desc,icon:mForm.icon||"✨"}];
    setMasajes(n); save("masajes", n);
    setMForm({icon:"✨",nombre:"",min:"",precio:"",desc:""});
    setMModal(false);
  };

  const addCita = () => {
    if (!ncForm.cid || !ncForm.mid || !ncForm.fecha || !ncForm.hora) return;
    const [y,mo,d] = ncForm.fecha.split("-").map(Number);
    const [h,mi]   = ncForm.hora.split(":").map(Number);
    const fecha = new Date(y,mo-1,d,h,mi);
    const m = gM(parseInt(ncForm.mid));
    const extraPrecio = parseFloat(ncForm.extra) || 0;
    const monto = (m?.precio||0) + (ncForm.domicilio ? 20 : 0) + extraPrecio;
    const nid = Math.max(...citas.map(c=>c.id))+1;
    const n = [...citas,{id:nid,cid:parseInt(ncForm.cid),mid:parseInt(ncForm.mid),fecha,estado:"pendiente",monto,domicilio:ncForm.domicilio,extraPrecio}];
    setCitas(n); save("citas", n);
    setNcForm({cid:"",mid:"",fecha:"",hora:"",domicilio:false,extra:""});
    setNcModal(false);
  };

  const copyLink = () => {
    navigator.clipboard.writeText(LINK).catch(()=>{});
    setCopied(true); setTimeout(()=>setCopied(false),2200);
  };

  const exportExcel = () => {
    const wb = XLSX.utils.book_new();

    // ── Hoja 1: TODAS LAS SESIONES ──
    const sesiones = citas.sort((a,b)=>a.fecha-b.fecha).map(c => {
      const cl = gC(c.cid), m = gM(c.mid);
      return {
        "Fecha":       c.fecha.toLocaleDateString("es-ES"),
        "Hora":        fmtTime(c.fecha),
        "Cliente":     cl?.nombre || "",
        "Teléfono":    cl?.tel || "",
        "Email":       cl?.email || "",
        "Servicio":    m?.nombre || "",
        "Duración (min)": (m?.min||0) + (c.extraMin||0),
        "Domicilio":   c.domicilio ? "Sí" : "No",
        "Importe (€)": c.monto,
        "Estado":      c.estado.charAt(0).toUpperCase() + c.estado.slice(1),
      };
    });
    const ws1 = XLSX.utils.json_to_sheet(sesiones);
    ws1["!cols"] = [10,7,22,16,24,14,14,10,12,12].map(w=>({wch:w}));
    XLSX.utils.book_append_sheet(wb, ws1, "Sesiones");

    // ── Hoja 2: INGRESOS COBRADOS ──
    const cobradas = citas.filter(c=>c.estado==="cobrada").sort((a,b)=>a.fecha-b.fecha).map(c => {
      const cl = gC(c.cid), m = gM(c.mid);
      return {
        "Fecha":           c.fecha.toLocaleDateString("es-ES"),
        "Concepto":        `Sesión de ${m?.nombre||""} — ${cl?.nombre||""}`,
        "Cliente":         cl?.nombre || "",
        "Servicio":        m?.nombre || "",
        "Domicilio":       c.domicilio ? "Sí (+20€)" : "No",
        "Base imponible":  c.monto,
        "IVA (0%)":        0,
        "Total cobrado":   c.monto,
      };
    });
    const ws2 = XLSX.utils.json_to_sheet(cobradas);
    ws2["!cols"] = [10,40,20,14,12,14,10,12].map(w=>({wch:w}));
    XLSX.utils.book_append_sheet(wb, ws2, "Ingresos cobrados");

    // ── Hoja 3: RESUMEN POR SERVICIO ──
    const porServicio = masajes.map(m => {
      const mCitas = citas.filter(c=>c.mid===m.id);
      const cobrado = mCitas.filter(c=>c.estado==="cobrada").reduce((s,c)=>s+c.monto,0);
      return {
        "Servicio":          m.nombre,
        "Precio base (€)":   m.precio,
        "Extra 30min (€)":   m.extra30||0,
        "Sesiones totales":  mCitas.length,
        "Sesiones cobradas": mCitas.filter(c=>c.estado==="cobrada").length,
        "Sesiones pendientes": mCitas.filter(c=>c.estado==="pendiente").length,
        "Total facturado (€)": cobrado,
      };
    });
    const ws3 = XLSX.utils.json_to_sheet(porServicio);
    ws3["!cols"] = [16,14,14,14,16,16,18].map(w=>({wch:w}));
    XLSX.utils.book_append_sheet(wb, ws3, "Por servicio");

    // ── Hoja 4: RESUMEN POR CLIENTE ──
    const porCliente = clientes.map(cl => {
      const cCitas = citas.filter(c=>c.cid===cl.id);
      const cobrado = cCitas.filter(c=>c.estado==="cobrada").reduce((s,c)=>s+c.monto,0);
      const domicilios = cCitas.filter(c=>c.domicilio).length;
      return {
        "Cliente":             cl.nombre,
        "Teléfono":            cl.tel,
        "Email":               cl.email,
        "Sesiones totales":    cCitas.length,
        "Sesiones cobradas":   cCitas.filter(c=>c.estado==="cobrada").length,
        "Visitas domicilio":   domicilios,
        "Total facturado (€)": cobrado,
        "Notas":               cl.notas || "",
      };
    });
    const ws4 = XLSX.utils.json_to_sheet(porCliente);
    ws4["!cols"] = [22,16,24,14,16,14,16,30].map(w=>({wch:w}));
    XLSX.utils.book_append_sheet(wb, ws4, "Por cliente");

    // ── Hoja 5: RESUMEN ANUAL ──
    const año = new Date().getFullYear();
    const meses = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
    const porMes = meses.map((mes, i) => {
      const mCitas = citas.filter(c => c.fecha.getMonth()===i && c.fecha.getFullYear()===año);
      const cobrado = mCitas.filter(c=>c.estado==="cobrada").reduce((s,c)=>s+c.monto,0);
      const pendiente = mCitas.filter(c=>c.estado==="pendiente").reduce((s,c)=>s+c.monto,0);
      return {
        "Mes":                  mes,
        "Sesiones":             mCitas.length,
        "Sesiones cobradas":    mCitas.filter(c=>c.estado==="cobrada").length,
        "Total cobrado (€)":    cobrado,
        "Total pendiente (€)":  pendiente,
        "Total generado (€)":   cobrado + pendiente,
      };
    });
    // Fila total
    porMes.push({
      "Mes": "TOTAL",
      "Sesiones": porMes.reduce((s,r)=>s+r["Sesiones"],0),
      "Sesiones cobradas": porMes.reduce((s,r)=>s+r["Sesiones cobradas"],0),
      "Total cobrado (€)": porMes.reduce((s,r)=>s+r["Total cobrado (€)"],0),
      "Total pendiente (€)": porMes.reduce((s,r)=>s+r["Total pendiente (€)"],0),
      "Total generado (€)": porMes.reduce((s,r)=>s+r["Total generado (€)"],0),
    });
    const ws5 = XLSX.utils.json_to_sheet(porMes);
    ws5["!cols"] = [14,10,16,16,16,16].map(w=>({wch:w}));
    XLSX.utils.book_append_sheet(wb, ws5, `Resumen ${año}`);

    const fecha = new Date().toLocaleDateString("es-ES").replace(/\//g,"-");
    XLSX.writeFile(wb, `DoshaBalance_${fecha}.xlsx`);
  };

          <div className="logo-t">Dosha Balance</div>
          <div className="logo-s">Studio · Valencia</div>
        </div>
        <nav className="nav">
          {NAV.map(n=>(
            <div key={n.id} className={`ni ${tab===n.id?"on":""}`} onClick={()=>setTab(n.id)}>
              <Icon n={n.icon} s={15}/> {n.label}

        </nav>
        <div style={{padding:"14px 20px",borderTop:"1px solid var(--b1)"}}>
          <div style={{fontSize:".68rem",color:"var(--mut)",textTransform:"uppercase",letterSpacing:".08em",lineHeight:1.6}}>
            {HOY.toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"long"})}
          </div>
          {saveStatus && (
            <div style={{marginTop:"8px",display:"flex",alignItems:"center",gap:"5px",fontSize:".68rem",color:saveStatus==="guardado"?"var(--green)":"var(--gold)"}}>
              {saveStatus==="guardado"
                ? <><Icon n="cloud-check" s={12}/>Guardado</>
                : <><Icon n="cloud-upload" s={12}/>Guardando...</>}
            </div>
          )}
        </div>
      </aside>

      {/* ─── MAIN ─── */}
      <main className="main">

        {/* ══ RESUMEN ══ */}
        {tab==="resumen" && (
          <div className="page">
            <div className="pt">Buenos días ☀️</div>
            <div className="ps">{HOY.toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}</div>
            <div className="sr">
              {[
                {label:"Sesiones hoy",  val:citasHoy.length, cls:"g"},
                {label:"Cobrado hoy",   val:fmt(cobHoy),     cls:"gn"},
                {label:"Pendiente hoy", val:fmt(penHoy),     cls:"am"},
                {label:"Total cobrado", val:fmt(cobTot),     cls:""},
              ].map(s=>(
                <div key={s.label} className="sc">
                  <div className="sl">{s.label}</div>
                  <div className={`sv ${s.cls}`}>{s.val}</div>
                </div>
              ))}
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 320px",gap:"18px"}}>
              <div className="card">
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"15px"}}>
                  <span style={{fontFamily:"var(--fd)",fontSize:"1rem",color:"var(--cream)",fontWeight:500}}>Agenda de hoy</span>
                  <button className="btn btn-g btn-sm" onClick={()=>setNcModal(true)}><Icon n="plus" s={12}/>Nueva cita</button>
                </div>
                {citasHoy.length===0
                  ? <div style={{textAlign:"center",padding:"32px",color:"var(--mut)",fontSize:".83rem"}}>Sin sesiones · ¡Descansa hoy!</div>
                  : <div className="tl">{citasHoy.map(c=>{
                      const cl=gC(c.cid), m=gM(c.mid);
                      return (
                        <div key={c.id} className="ti">
                          <div className="tt">{fmtTime(c.fecha)}</div>
                          <DOT c={c}/>
                          <div style={{flex:1}}>
                            <div className="tn">{cl?.nombre}</div>
                            <div className="tdesc">{m?.icon} {m?.nombre} · {m?.min}min{c.domicilio?" · 🚗 domicilio":""}{c.extraPrecio>0?` · +${fmt(c.extraPrecio)} extra`:""}</div>
                          </div>
                          <div style={{display:"flex",alignItems:"center",gap:"8px"}}>
                            <span className={`badge ${c.estado}`}>{c.estado}</span>
                            <span style={{fontFamily:"var(--fd)",fontSize:".95rem",color:"var(--gold)"}}>{fmt(c.monto)}</span>
                            {c.estado==="pendiente" && <button className="btn btn-g btn-sm" onClick={()=>cobrar(c.id)}><Icon n="check" s={11}/>Cobrar</button>}
                          </div>
                        </div>
                      );
                    })}</div>
                }
              </div>
              <div className="card">
                <div style={{fontFamily:"var(--fd)",fontSize:"1rem",color:"var(--cream)",fontWeight:500,marginBottom:"13px"}}>Próximas sesiones</div>
                {[1,2,3].map(off=>{

                    <div key={off} style={{marginBottom:"13px"}}>
                      <div style={{fontSize:".68rem",color:"var(--mut)",textTransform:"uppercase",letterSpacing:".08em",marginBottom:"5px"}}>
                        {d.toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"short"})}
                      </div>
                      {dc.length===0
                        ? <div style={{fontSize:".76rem",color:"var(--mut)",fontStyle:"italic"}}>Sin sesiones</div>
                        : dc.map(c=>{
                          const cl=gC(c.cid), m=gM(c.mid);
                          return (
                            <div key={c.id} style={{display:"flex",alignItems:"center",gap:"8px",padding:"5px 0",borderBottom:"1px solid var(--b1)"}}>

                              <span style={{fontSize:".8rem",color:"var(--cream)",flex:1}}>{cl?.nombre}</span>

                    </div>

                })}
              </div>
            </div>
          </div>
        )}

        {/* ══ CALENDARIO ══ */}
        {tab==="calendario" && (
          <div className="page">
            <div className="pt">Calendario</div>
            <div className="ps">Puntos dorados indican sesiones · haz clic en un día</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 300px",gap:"18px"}}>
              <div className="card">
                <div className="ch">
                  <button className="btn-gh" onClick={()=>setCalBase(new Date(cy,cm-1,1))}><Icon n="chevron-left" s={16}/></button>
                  <div className="ct">{MESES[cm]} {cy}</div>
                  <button className="btn-gh" onClick={()=>setCalBase(new Date(cy,cm+1,1))}><Icon n="chevron-right" s={16}/></button>
                </div>
                <div className="cg">
                  {DIAS.map(d=><div key={d} className="cwd">{d}</div>)}

                  {Array.from({length:daysInM}).map((_,i)=>{

                    const isS = selDay.getFullYear()===cy&&selDay.getMonth()===cm&&selDay.getDate()===day;

                        {day}

                </div>
              </div>
              <div className="card">
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"15px"}}>
                  <span style={{fontFamily:"var(--fd)",fontSize:"1rem",color:"var(--cream)",fontWeight:500}}>
                    {selDay.toLocaleDateString("es-ES",{day:"numeric",month:"long"})}

            {bonoForm.mid && bonoForm.cid && (()=>{
              const mid=parseInt(bonoForm.mid), ses=parseInt(bonoForm.sesiones);
              const precio=getBonoPrice(mid,ses);
              const m=gM(mid);
              return precio>0 ? (
                <div style={{background:"rgba(201,152,56,.08)",border:"1px solid rgba(201,152,56,.2)",borderRadius:"8px",padding:"12px 14px",marginBottom:"4px"}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                    <div>
                      <div style={{fontSize:".8rem",color:"var(--mut2)"}}>{m?.icon} {m?.nombre} × {ses} sesiones</div>
                      <div style={{fontSize:".72rem",color:"var(--mut)",marginTop:"2px"}}>
                        {m ? `${fmt(m.precio)}/sesión · ahorro ${fmt(m.precio*ses-precio)}` : ""}
                      </div>
                    </div>
                    <span style={{fontFamily:"var(--fd)",fontSize:"1.4rem",color:"var(--gold)",fontWeight:600}}>{fmt(precio)}</span>
                  </div>
                </div>
              ) : (
                <div style={{fontSize:".78rem",color:"var(--amb)",padding:"8px 12px",background:"rgba(201,128,40,.08)",borderRadius:"7px",border:"1px solid rgba(201,128,40,.2)",marginBottom:"4px"}}>
                  ⚠️ Define el precio de este bono en la tabla antes de venderlo
                </div>
              );
            })()}

            <div style={{display:"flex",gap:"9px",justifyContent:"flex-end",marginTop:"16px"}}>
              <button className="btn btn-o" onClick={()=>setBonoModal(false)}>Cancelar</button>
              <button className="btn btn-g" onClick={venderBono}>Vender bono</button>
            </div>
          </div>
        </div>
      )}

      {/* ─── MODAL: Nuevo cliente ─── */}
      {clModal&&(
        <div className="ov" onClick={()=>setClModal(false)}>
          <div className="modal" onClick={e=>e.stopPropagation()}>
            <div className="modt">Nuevo cliente</div>
            <div className="fg">
              <label className="fl">Nombre completo *</label>
              <input className="inp" value={clForm.nombre} onChange={e=>setClForm(p=>({...p,nombre:e.target.value}))} placeholder="Nombre y apellidos..."/>
            </div>
            <div className="fr">
              <div className="fg">
                <label className="fl">Teléfono</label>
                <input className="inp" value={clForm.tel} onChange={e=>setClForm(p=>({...p,tel:e.target.value}))} placeholder="+34 6XX XXX XXX"/>
              </div>
              <div className="fg">
                <label className="fl">Email</label>
                <input type="email" className="inp" value={clForm.email} onChange={e=>setClForm(p=>({...p,email:e.target.value}))} placeholder="correo@email.com"/>
              </div>
            </div>
            <div className="fg">
              <label className="fl">Masaje favorito</label>
              <select className="inp" value={clForm.fav} onChange={e=>setClForm(p=>({...p,fav:e.target.value}))}>
                <option value="">Sin preferencia</option>
                {masajes.map(m=><option key={m.id} value={m.id}>{m.icon} {m.nombre}</option>)}
              </select>
            </div>
            <div className="fg">
              <label className="fl">Notas / Avisos</label>
              <textarea className="inp" value={clForm.notas} onChange={e=>setClForm(p=>({...p,notas:e.target.value}))} placeholder="Alergias, preferencias, observaciones..."/>
            </div>
            <div style={{display:"flex",gap:"9px",justifyContent:"flex-end",marginTop:"18px"}}>
              <button className="btn btn-o" onClick={()=>setClModal(false)}>Cancelar</button>
              <button className="btn btn-g" onClick={addCliente}>Guardar cliente</button>
            </div>
          </div>
        </div>
      )}

      {/* ─── MODAL: Nueva cita ─── */}
      {ncModal&&(
        <div className="ov" onClick={()=>setNcModal(false)}>
          <div className="modal" onClick={e=>e.stopPropagation()}>
            <div className="modt">Nueva cita</div>
            <div className="fg">
              <label className="fl">Cliente</label>
              <select className="inp" value={ncForm.cid} onChange={e=>setNcForm(p=>({...p,cid:e.target.value}))}>
                <option value="">Seleccionar cliente...</option>
                {clientes.map(c=><option key={c.id} value={c.id}>{c.nombre}</option>)}
              </select>
            </div>
            <div className="fg">
              <label className="fl">Masaje</label>
              <select className="inp" value={ncForm.mid} onChange={e=>setNcForm(p=>({...p,mid:e.target.value,extra:0}))}>
                <option value="">Seleccionar masaje...</option>
                {masajes.map(m=><option key={m.id} value={m.id}>{m.icon} {m.nombre} — {fmt(m.precio)}</option>)}
              </select>
            </div>
            <div className="fr">
              <div className="fg">
                <label className="fl">Fecha</label>
                <input type="date" className="inp" value={ncForm.fecha} onChange={e=>setNcForm(p=>({...p,fecha:e.target.value}))}/>
              </div>
              <div className="fg">
                <label className="fl">Hora</label>
                <input type="time" className="inp" value={ncForm.hora} onChange={e=>setNcForm(p=>({...p,hora:e.target.value}))}/>
              </div>
            </div>

            {/* ── Extras ── */}
            <div style={{background:"var(--surf)",border:"1px solid var(--b1)",borderRadius:"9px",padding:"14px",marginBottom:"13px"}}>
              <div style={{fontSize:".72rem",color:"var(--mut2)",textTransform:"uppercase",letterSpacing:".08em",marginBottom:"12px",fontWeight:500}}>Extras</div>

              {/* Desplazamiento */}
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"10px 0",borderBottom:"1px solid var(--b1)"}}>
                <div>
                  <div style={{fontSize:".84rem",color:"var(--cream)",fontWeight:500}}>🚗 Desplazamiento a domicilio</div>
                  <div style={{fontSize:".72rem",color:"var(--mut)",marginTop:"2px"}}>Suplemento por visita en domicilio</div>
                </div>
                <div style={{display:"flex",alignItems:"center",gap:"10px"}}>
                  <span style={{fontFamily:"var(--fd)",fontSize:"1rem",color:"var(--gold)"}}>+20€</span>
                  <div
                    onClick={()=>setNcForm(p=>({...p,domicilio:!p.domicilio}))}
                    style={{
                      width:"40px",height:"22px",borderRadius:"11px",cursor:"pointer",transition:"background .2s",flexShrink:0,
                      background:ncForm.domicilio?"var(--gold)":"var(--b2)",position:"relative"
                    }}
                  >
                    <div style={{
                      position:"absolute",top:"3px",width:"16px",height:"16px",borderRadius:"50%",background:"white",transition:"left .2s",
                      left:ncForm.domicilio?"21px":"3px"
                    }}/>
                  </div>
                </div>
              </div>

              {/* Tiempo extra */}
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"10px 0"}}>
                <div>
                  <div style={{fontSize:".84rem",color:"var(--cream)",fontWeight:500}}>⏱ Tiempo extra</div>
                  <div style={{fontSize:".72rem",color:"var(--mut)",marginTop:"2px"}}>Importe adicional por tiempo extra</div>
                </div>
                <div style={{display:"flex",alignItems:"center",gap:"6px"}}>
                  <span style={{fontFamily:"var(--fd)",fontSize:"1rem",color:"var(--gold)"}}>+</span>
                  <input
                    type="number"
                    min="0"
                    placeholder="0"
                    className="inp"
                    value={ncForm.extra}
                    onChange={e=>setNcForm(p=>({...p,extra:e.target.value}))}
                    style={{width:"90px",textAlign:"right",fontFamily:"var(--fd)",fontSize:"1rem",color:"var(--gold)"}}
                  />
                  <span style={{fontSize:".8rem",color:"var(--mut)"}}>€</span>
                </div>
              </div>
            </div>

            {/* Resumen precio */}
            {ncForm.mid&&(
              <div style={{background:"rgba(201,152,56,.08)",border:"1px solid rgba(201,152,56,.2)",borderRadius:"8px",padding:"12px 14px",marginBottom:"13px"}}>
                <div style={{fontSize:".72rem",color:"var(--mut)",textTransform:"uppercase",letterSpacing:".08em",marginBottom:"8px"}}>Resumen</div>
                {(()=>{
                  const m=gM(parseInt(ncForm.mid));
                  const extraPrecio=parseFloat(ncForm.extra)||0;
                  const total=(m?.precio||0)+(ncForm.domicilio?20:0)+extraPrecio;
                  return (
                    <div>
                      <div style={{display:"flex",justifyContent:"space-between",fontSize:".8rem",color:"var(--mut2)",marginBottom:"4px"}}>
                        <span>{m?.nombre} ({m?.min}min)</span><span>{fmt(m?.precio)}</span>
                      </div>
                      {ncForm.domicilio&&<div style={{display:"flex",justifyContent:"space-between",fontSize:".8rem",color:"var(--mut2)",marginBottom:"4px"}}><span>Desplazamiento</span><span>+20€</span></div>}
                      {extraPrecio>0&&<div style={{display:"flex",justifyContent:"space-between",fontSize:".8rem",color:"var(--mut2)",marginBottom:"4px"}}><span>Tiempo extra</span><span>+{fmt(extraPrecio)}</span></div>}
                      <div style={{borderTop:"1px solid rgba(201,152,56,.25)",paddingTop:"8px",marginTop:"4px",display:"flex",justifyContent:"flex-end"}}>
                        <span style={{fontFamily:"var(--fd)",fontSize:"1.3rem",color:"var(--gold)",fontWeight:600}}>{fmt(total)}</span>
                      </div>
                    </div>
                  );
                })()}
              </div>
            )}

            <div style={{display:"flex",gap:"9px",justifyContent:"flex-end",marginTop:"4px"}}>
              <button className="btn btn-o" onClick={()=>setNcModal(false)}>Cancelar</button>
              <button className="btn btn-g" onClick={addCita}>Guardar cita</button>
            </div>
          </div>
        </div>
      )}

      {/* ─── MODAL: Añadir masaje ─── */}
      {mModal&&(
        <div className="ov" onClick={()=>setMModal(false)}>
          <div className="modal" onClick={e=>e.stopPropagation()}>
            <div className="modt">Nuevo masaje</div>
            <div className="fr">
              <div className="fg">
                <label className="fl">Icono (emoji)</label>
                <input className="inp" value={mForm.icon} onChange={e=>setMForm(p=>({...p,icon:e.target.value}))} placeholder="✨"/>
              </div>
              <div className="fg">
                <label className="fl">Nombre</label>
                <input className="inp" value={mForm.nombre} onChange={e=>setMForm(p=>({...p,nombre:e.target.value}))} placeholder="Nombre del masaje..."/>
              </div>
            </div>
            <div className="fr">
              <div className="fg">
                <label className="fl">Duración (min)</label>
                <input type="number" className="inp" value={mForm.min} onChange={e=>setMForm(p=>({...p,min:e.target.value}))} placeholder="60"/>
              </div>
              <div className="fg">
                <label className="fl">Precio (€)</label>
                <input type="number" className="inp" value={mForm.precio} onChange={e=>setMForm(p=>({...p,precio:e.target.value}))} placeholder="70"/>
              </div>
            </div>
            <div className="fg">
              <label className="fl">Descripción</label>
              <textarea className="inp" value={mForm.desc} onChange={e=>setMForm(p=>({...p,desc:e.target.value}))} placeholder="Breve descripción del masaje..."/>
            </div>
            <div style={{display:"flex",gap:"9px",justifyContent:"flex-end",marginTop:"18px"}}>
              <button className="btn btn-o" onClick={()=>setMModal(false)}>Cancelar</button>
              <button className="btn btn-g" onClick={addMasaje}>Añadir masaje</button>
            </div>
          </div>
        </div>
      )}

      {/* ─── MODAL: Detalle cliente ─── */}
      {selCl&&(
        <div className="ov" onClick={()=>setSelCl(null)}>
          <div className="modal" style={{maxWidth:"560px"}} onClick={e=>e.stopPropagation()}>
            <div style={{display:"flex",gap:"14px",alignItems:"flex-start",marginBottom:"18px"}}>
              <div className="av" style={{width:"46px",height:"46px",fontSize:"1.1rem"}}>{selCl.nombre.charAt(0)}</div>
              <div style={{flex:1}}>
                <div className="modt" style={{marginBottom:"3px"}}>{selCl.nombre}</div>
                <div style={{display:"flex",gap:"13px",fontSize:".76rem",color:"var(--mut2)"}}>
                  <span>📞 {selCl.tel}</span>
                  <span>✉️ {selCl.email}</span>
                </div>
              </div>
              <button className="btn-gh" onClick={()=>setSelCl(null)}><Icon n="x" s={15}/></button>
            </div>
            {selCl.notas&&(
              <div style={{background:"rgba(201,128,40,.1)",border:"1px solid rgba(201,128,40,.2)",borderRadius:"7px",padding:"9px 13px",fontSize:".8rem",color:"var(--amb)",marginBottom:"14px"}}>
                ⚠️ {selCl.notas}
              </div>
            )}
            <div style={{display:"flex",gap:"13px",marginBottom:"18px"}}>
              {[
                {l:"Total facturado",v:fmt(clTotal(selCl.id)),c:"var(--gold)"},
                {l:"Sesiones",v:clCitas(selCl.id).length,c:"var(--cream)"},
                {l:"Masaje favorito",v:gM(selCl.fav)?.nombre,c:"var(--mut2)"},
              ].map(s=>(
                <div key={s.l} style={{flex:1,textAlign:"center",background:"var(--surf)",borderRadius:"7px",padding:"11px"}}>
                  <div style={{fontSize:".65rem",color:"var(--mut)",textTransform:"uppercase",letterSpacing:".08em",marginBottom:"3px"}}>{s.l}</div>
                  <div style={{fontFamily:"var(--fd)",fontSize:"1.05rem",color:s.c,fontWeight:500}}>{s.v}</div>
                </div>
              ))}
            </div>
            <div style={{fontFamily:"var(--fd)",fontSize:".9rem",color:"var(--cream)",fontWeight:500,marginBottom:"10px"}}>Historial de sesiones</div>
            <div style={{maxHeight:"240px",overflowY:"auto"}}>
              {clCitas(selCl.id).sort((a,b)=>b.fecha-a.fecha).map(c=>{
                const m=gM(c.mid);
                return (
                  <div key={c.id} style={{display:"flex",alignItems:"center",gap:"11px",padding:"9px 0",borderBottom:"1px solid var(--b1)"}}>
                    <div style={{fontSize:".69rem",color:"var(--mut)",minWidth:"68px"}}>
                      {c.fecha.toLocaleDateString("es-ES",{day:"2-digit",month:"short",year:"2-digit"})}
                    </div>
                    <div style={{flex:1,fontSize:".8rem",color:"var(--cream)"}}>{m?.icon} {m?.nombre}</div>
                    <span className={`badge ${c.estado}`}>{c.estado}</span>
                    <span style={{fontFamily:"var(--fd)",fontSize:".9rem",color:"var(--gold)"}}>{fmt(c.monto)}</span>
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<DoshaApp/>);
</script>
</body>
</html>
